services:
  - type: web
    name: smarte-muelltonne-2-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: cd Smarte*/Software/smart-bin/backend && pip install -r requirements.txt
    startCommand: cd Smarte*/Software/smart-bin/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        value: sqlite:///./smart_bin.db
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://smarte-muelltonne-2-dashboard.onrender.com"]'
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: DEPOT_LAT
        value: 51.5583
      - key: DEPOT_LNG
        value: 8.1303
      - key: DEPOT_NAME
        value: Betriebshof Doyenweg
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: smarte-muelltonne-2-dashboard
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd Smarte*/Software/smart-bin/frontend && rm -rf node_modules && npm cache clean --force && npm ci --cache /tmp/npm-cache && mkdir -p node_modules/next/dist/compiled/@next/react-refresh-utils && cp -R node_modules/@next/react-refresh-utils/. node_modules/next/dist/compiled/@next/react-refresh-utils/ && node -e "console.log(require.resolve('next/dist/compiled/@next/react-refresh-utils/dist/runtime'))" && npm run build
    startCommand: cd Smarte*/Software/smart-bin/frontend && npm start -- -p $PORT
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_API_URL
        value: https://smarte-muelltonne-2-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://smarte-muelltonne-2-api.onrender.com/ws/live
