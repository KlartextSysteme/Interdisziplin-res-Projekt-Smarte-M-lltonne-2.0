[project]
name = "smart-bin-backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "websockets>=13",
    "pynmea2>=1.19",
    "langchain-groq>=1.1.2",
    "python-tsp>=0.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
